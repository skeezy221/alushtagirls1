<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .activity-feed {
            max-width: 560px;
            margin: 20px auto 35px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .activity-item {
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(220, 20, 60, 0.4);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: #ffffff;
        }

        .activity-item:hover {
            transform: translateY(-2px);
            border-color: #dc143c;
            box-shadow: 0 0 18px rgba(220, 20, 60, 0.4);
        }

        .activity-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(220, 20, 60, 0.18);
            border: 1px solid rgba(220, 20, 60, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .activity-body {
            flex: 1;
            min-width: 0;
        }

        .activity-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .activity-title {
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .activity-title span {
            color: #ff6b81;
        }

        .activity-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
        }

        .activity-preview {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.82);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Личный кабинет</h1>

        <section class="profile-card" id="profile-card" style="display: none;">
            <div class="profile-header-info">
                <div class="avatar-upload-container">
                    <div class="profile-avatar" id="profile-avatar">?</div>
                    <label for="avatar-input" class="avatar-upload-btn" title="Загрузить фото">📷 Фото</label>
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                </div>
                <div class="profile-details">
                    <h2 id="profile-username">@user</h2>
                    <p class="profile-meta" id="profile-email">Email: ...</p>
                    <p class="profile-meta" id="profile-date">На сайте с: ...</p>
                </div>
            </div>

            <div class="form-group">
                <label for="profile-bio">Статус / О себе</label>
                <textarea id="profile-bio" rows="3" placeholder="Расскажите о себе..."></textarea>
            </div>

            <div id="profile-message" class="form-message"></div>

            <div class="profile-actions">
                <button type="button" class="btn-submit" id="save-profile-btn">Сохранить изменения</button>
                <button type="button" class="btn-danger" id="logout-profile-btn">Выйти из аккаунта</button>
            </div>
        </section>

        <!-- Лента всех недавних действий на сайте -->
        <h2>Недавние действия на сайте</h2>
        <div class="activity-feed" id="recent-activity-list">
            <p class="empty-posts">Загрузка последних действий...</p>
        </div>

        <nav>
            <a href="index.html">На главную</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a>
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        const currentUsername = getCurrentUsername();

        if (!currentUsername) {
            window.location.href = 'login.html';
        } else {
            const profileCard = document.getElementById('profile-card');
            const avatarBox = document.getElementById('profile-avatar');
            const avatarInput = document.getElementById('avatar-input');
            const usernameEl = document.getElementById('profile-username');
            const emailEl = document.getElementById('profile-email');
            const dateEl = document.getElementById('profile-date');
            const bioInput = document.getElementById('profile-bio');
            const messageBox = document.getElementById('profile-message');
            const saveBtn = document.getElementById('save-profile-btn');
            const logoutBtn = document.getElementById('logout-profile-btn');
            const activityList = document.getElementById('recent-activity-list');

            const userDocRef = db.collection('users').doc(currentUsername.toLowerCase());
            let currentAvatarBase64 = '';

            function renderAvatar(avatarData, username) {
                if (avatarData) {
                    avatarBox.innerHTML = `<img src="${avatarData}" alt="Аватар">`;
                } else {
                    avatarBox.textContent = username.charAt(0).toUpperCase();
                }
            }

            userDocRef.get().then(doc => {
                if (!doc.exists) {
                    logoutUser();
                    return;
                }
                const userData = doc.data();
                profileCard.style.display = 'block';

                usernameEl.textContent = '@' + userData.username;
                emailEl.textContent = 'Email: ' + userData.email;
                dateEl.textContent = 'На сайте с: ' + (userData.regDate || 'недавно');
                bioInput.value = userData.bio || '';
                currentAvatarBase64 = userData.avatar || '';
                renderAvatar(currentAvatarBase64, userData.username);
            });

            avatarInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const size = 250;
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');

                        const minSide = Math.min(img.width, img.height);
                        const sx = (img.width - minSide) / 2;
                        const sy = (img.height - minSide) / 2;

                        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

                        currentAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        renderAvatar(currentAvatarBase64, currentUsername);

                        messageBox.textContent = 'Фото выбрано! Нажмите «Сохранить изменения».';
                        messageBox.className = 'form-message success';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = 'Сохранение...';
                try {
                    await userDocRef.update({
                        bio: bioInput.value.trim(),
                        avatar: currentAvatarBase64
                    });
                    messageBox.textContent = 'Профиль обновлён в облаке!';
                    messageBox.className = 'form-message success';

                    const topAvatar = document.querySelector('.top-bar-avatar');
                    if (topAvatar && currentAvatarBase64) {
                        topAvatar.src = currentAvatarBase64;
                    }
                    setTimeout(() => { messageBox.textContent = ''; }, 2500);
                } catch (err) {
                    console.error(err);
                    messageBox.textContent = 'Ошибка при сохранении профиля.';
                    messageBox.className = 'form-message error';
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Сохранить изменения';
                }
            });

            logoutBtn.addEventListener('click', () => {
                logoutUser();
            });

            // Объединяем недавние действия на сайте («Girls From Alushta» и «Поддержка»)
            let recentSupport = [];
            let recentGirls = [];

            function renderAllActivity() {
                const combined = [...recentGirls, ...recentSupport]
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    .slice(0, 15);

                activityList.innerHTML = '';

                if (combined.length === 0) {
                    activityList.innerHTML = '<p class="empty-posts">Пока нет недавних действий на сайте.</p>';
                    return;
                }

                combined.forEach(item => {
                    const link = document.createElement('a');
                    link.className = 'activity-item';
                    link.href = item.href;

                    const badge = document.createElement('div');
                    badge.className = 'activity-badge';
                    badge.textContent = item.icon;

                    const body = document.createElement('div');
                    body.className = 'activity-body';

                    const top = document.createElement('div');
                    top.className = 'activity-top';

                    const title = document.createElement('div');
                    title.className = 'activity-title';
                    title.innerHTML = item.titleHtml;

                    const time = document.createElement('span');
                    time.className = 'activity-time';
                    time.textContent = item.date || '';

                    top.appendChild(title);
                    top.appendChild(time);

                    const preview = document.createElement('p');
                    preview.className = 'activity-preview';
                    preview.textContent = item.previewText;

                    body.appendChild(top);
                    body.appendChild(preview);

                    link.appendChild(badge);
                    link.appendChild(body);
                    activityList.appendChild(link);
                });
            }

            // Слушаем новые анкеты из «Girls From Alushta»
            db.collection('girls_profiles').orderBy('createdAt', 'desc').limit(10).onSnapshot(snapshot => {
                recentGirls = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    recentGirls.push({
                        icon: '♥',
                        titleHtml: `Новая анкета: <span>${data.name}, ${data.age}</span> в «Girls From Alushta»`,
                        previewText: data.bio || '',
                        date: data.date || '',
                        createdAt: data.createdAt || 0,
                        href: 'about.html'
                    });
                });
                renderAllActivity();
            });

            // Слушаем обращения в «Поддержку»
            db.collection('support_tickets').orderBy('createdAt', 'desc').limit(10).onSnapshot(snapshot => {
                recentSupport = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isReport = data.type === 'report';
                    const sender = data.sender || 'Участник';
                    recentSupport.push({
                        icon: isReport ? '🚨' : '💬',
                        titleHtml: isReport
                            ? `<span>@${sender}</span> отправил(а) жалобу в «Поддержку»`
                            : `<span>@${sender}</span> задал(а) вопрос в «Поддержке»`,
                        previewText: isReport ? `На: ${data.target} — ${data.reason}` : (data.topic || data.text || ''),
                        date: data.date || '',
                        createdAt: data.createdAt || 0,
                        href: 'contacts.html'
                    });
                });
                renderAllActivity();
            });
        }
    </script>

</body>
</html>
