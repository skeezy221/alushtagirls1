<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-card {
            position: relative;
        }

        /* Кнопка-шестерёнка в правом верхнем углу профиля */
        .settings-gear-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(220, 20, 60, 0.45);
            color: #ffffff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.35s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .settings-gear-btn:hover,
        .settings-gear-btn.active {
            background: rgba(220, 20, 60, 0.25);
            border-color: #dc143c;
            box-shadow: 0 0 14px rgba(220, 20, 60, 0.55);
            transform: rotate(90deg);
        }

        /* Раскрывающаяся панель настроек по шестерёнке */
        .settings-drawer {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(220, 20, 60, 0.35);
            text-align: left;
            animation: slideDownSettings 0.25s ease;
        }

        @keyframes slideDownSettings {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .settings-drawer-header h3 {
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: #ff6b81;
        }

        .settings-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .settings-grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .username-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .username-prefix {
            position: absolute;
            left: 14px;
            color: #ff6b81;
            font-weight: 700;
            font-size: 15px;
            pointer-events: none;
        }

        .username-input-wrap input {
            padding-left: 30px !important;
        }

        .field-hint {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* Лента недавних действий */
        .activity-feed {
            max-width: 560px;
            margin: 20px auto 35px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .activity-item {
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(220, 20, 60, 0.4);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: #ffffff;
        }

        .activity-item:hover {
            transform: translateY(-2px);
            border-color: #dc143c;
            box-shadow: 0 0 18px rgba(220, 20, 60, 0.4);
        }

        .activity-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(220, 20, 60, 0.18);
            border: 1px solid rgba(220, 20, 60, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .activity-body {
            flex: 1;
            min-width: 0;
        }

        .activity-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .activity-title {
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .activity-title span {
            color: #ff6b81;
        }

        .activity-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
        }

        .activity-preview {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.82);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Личный кабинет</h1>

        <section class="profile-card" id="profile-card" style="display: none;">
            <!-- Кнопка-шестерёнка для открытия настроек аккаунта -->
            <button type="button" class="settings-gear-btn" id="toggle-settings-btn" title="Настройки аккаунта">⚙️</button>

            <div class="profile-header-info">
                <div class="avatar-upload-container">
                    <div class="profile-avatar" id="profile-avatar">?</div>
                    <label for="avatar-input" class="avatar-upload-btn" title="Загрузить фото">📷 Фото</label>
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                </div>
                <div class="profile-details">
                    <h2 id="profile-username">@user</h2>
                    <p class="profile-meta" id="profile-email">Email: ...</p>
                    <p class="profile-meta" id="profile-date">На сайте с: ...</p>
                </div>
            </div>

            <div class="form-group">
                <label for="profile-bio">Статус / О себе</label>
                <textarea id="profile-bio" rows="3" placeholder="Расскажите о себе..."></textarea>
            </div>

            <!-- Скрытая по умолчанию панель настроек (открывается по клику на ⚙️) -->
            <div class="settings-drawer" id="settings-drawer" style="display: none;">
                <div class="settings-drawer-header">
                    <h3>⚙️ Настройки аккаунта</h3>
                    <a id="view-public-link" href="#" style="font-size: 12.5px; color: #ff6b81; text-decoration: none;">👁 Публичный вид →</a>
                </div>

                <div class="settings-grid-2">
                    <div class="form-group">
                        <label for="edit-username">Имя пользователя (логин)</label>
                        <div class="username-input-wrap">
                            <span class="username-prefix">@</span>
                            <input type="text" id="edit-username" minlength="3" maxlength="20" placeholder="username">
                        </div>
                        <div class="field-hint">Латиница, цифры или _ (3–20)</div>
                    </div>

                    <div class="form-group">
                        <label for="edit-display-name">Отображаемое имя</label>
                        <input type="text" id="edit-display-name" maxlength="30" placeholder="Например: Максим">
                        <div class="field-hint">Имя рядом с ником</div>
                    </div>
                </div>

                <!-- Контейнер для будущих расширяемых полей -->
                <div id="extra-profile-fields" class="settings-grid-2"></div>

                <div class="settings-grid-2">
                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input type="email" id="edit-email" placeholder="example@mail.ru">
                    </div>

                    <div class="form-group">
                        <label for="edit-password">Новый пароль</label>
                        <input type="password" id="edit-password" minlength="4" placeholder="Не менять — оставить пустым">
                    </div>
                </div>
            </div>

            <div id="profile-message" class="form-message"></div>

            <div class="profile-actions">
                <button type="button" class="btn-submit" id="save-profile-btn">Сохранить изменения</button>
                <button type="button" class="btn-danger" id="logout-profile-btn">Выйти из аккаунта</button>
            </div>
        </section>

        <!-- Лента всех недавних действий на сайте -->
        <h2>Недавние действия на сайте</h2>
        <div class="activity-feed" id="recent-activity-list">
            <p class="empty-posts">Загрузка последних действий...</p>
        </div>

        <nav>
            <a href="index.html">На главную</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a>
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        let currentUsername = getCurrentUsername();

        // =========================================================================
        // КОНСТРУКТОР БУДУЩИХ ПОЛЕЙ В НАСТРОЙКАХ (по шестерёнке):
        // Добавь сюда объект — поле само появится в шестерёнке и сохранится в БД.
        // =========================================================================
        const EXTRA_PROFILE_FIELDS = [
            // { key: 'telegram', label: 'Telegram', type: 'text', placeholder: '@username', maxLength: 40 },
            // { key: 'city', label: 'Город', type: 'text', placeholder: 'Алушта', maxLength: 40 }
        ];

        if (!currentUsername) {
            window.location.href = 'login.html';
        } else {
            const profileCard = document.getElementById('profile-card');
            const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
            const settingsDrawer = document.getElementById('settings-drawer');

            const avatarBox = document.getElementById('profile-avatar');
            const avatarInput = document.getElementById('avatar-input');
            const usernameEl = document.getElementById('profile-username');
            const emailEl = document.getElementById('profile-email');
            const dateEl = document.getElementById('profile-date');
            const bioInput = document.getElementById('profile-bio');
            const viewPublicLink = document.getElementById('view-public-link');

            const editUsernameInput = document.getElementById('edit-username');
            const editDisplayNameInput = document.getElementById('edit-display-name');
            const editEmailInput = document.getElementById('edit-email');
            const editPasswordInput = document.getElementById('edit-password');
            const extraFieldsContainer = document.getElementById('extra-profile-fields');

            const messageBox = document.getElementById('profile-message');
            const saveBtn = document.getElementById('save-profile-btn');
            const logoutBtn = document.getElementById('logout-profile-btn');
            const activityList = document.getElementById('recent-activity-list');

            let loadedUserData = null;
            let currentAvatarBase64 = '';

            // Открытие / закрытие настроек по шестерёнке
            toggleSettingsBtn.addEventListener('click', () => {
                const isClosed = settingsDrawer.style.display === 'none';
                settingsDrawer.style.display = isClosed ? 'block' : 'none';
                toggleSettingsBtn.classList.toggle('active', isClosed);
            });

            // Создаём дополнительные поля из EXTRA_PROFILE_FIELDS (если заданы)
            EXTRA_PROFILE_FIELDS.forEach(field => {
                const group = document.createElement('div');
                group.className = 'form-group';
                group.innerHTML = `
                    <label for="extra-${field.key}">${field.label}</label>
                    <input type="${field.type || 'text'}" id="extra-${field.key}" placeholder="${field.placeholder || ''}" maxlength="${field.maxLength || 80}">
                `;
                extraFieldsContainer.appendChild(group);
            });

            function renderAvatar(avatarData, username) {
                if (avatarData) {
                    avatarBox.innerHTML = `<img src="${avatarData}" alt="Аватар">`;
                } else {
                    avatarBox.textContent = username.charAt(0).toUpperCase();
                }
            }

            async function loadProfile() {
                const doc = await db.collection('users').doc(currentUsername.toLowerCase()).get();
                if (!doc.exists) {
                    logoutUser();
                    return;
                }

                loadedUserData = doc.data();
                profileCard.style.display = 'block';

                usernameEl.textContent = loadedUserData.displayName
                    ? `${loadedUserData.displayName} (@${loadedUserData.username})`
                    : `@${loadedUserData.username}`;
                emailEl.textContent = 'Email: ' + loadedUserData.email;
                dateEl.textContent = 'На сайте с: ' + (loadedUserData.regDate || 'недавно');
                bioInput.value = loadedUserData.bio || '';
                viewPublicLink.href = `user.html?u=${encodeURIComponent(loadedUserData.username)}`;

                // Заполняем поля внутри шестерёнки
                editUsernameInput.value = loadedUserData.username || '';
                editDisplayNameInput.value = loadedUserData.displayName || '';
                editEmailInput.value = loadedUserData.email || '';
                editPasswordInput.value = '';

                EXTRA_PROFILE_FIELDS.forEach(field => {
                    const el = document.getElementById(`extra-${field.key}`);
                    if (el) el.value = loadedUserData[field.key] || '';
                });

                currentAvatarBase64 = loadedUserData.avatar || '';
                renderAvatar(currentAvatarBase64, loadedUserData.username);
            }

            loadProfile();

            avatarInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const size = 250;
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');

                        const minSide = Math.min(img.width, img.height);
                        const sx = (img.width - minSide) / 2;
                        const sy = (img.height - minSide) / 2;

                        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

                        currentAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        renderAvatar(currentAvatarBase64, currentUsername);

                        messageBox.textContent = 'Фото выбрано! Нажмите «Сохранить изменения».';
                        messageBox.className = 'form-message success';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            saveBtn.addEventListener('click', async () => {
                if (!loadedUserData) return;

                const newUsername = editUsernameInput.value.trim().replace(/^@+/, '');
                const newDisplayName = editDisplayNameInput.value.trim();
                const newBio = bioInput.value.trim();
                const newEmail = editEmailInput.value.trim();
                const newPassword = editPasswordInput.value.trim();

                if (!/^[a-zA-Z0-9_]{3,20}$/.test(newUsername)) {
                    settingsDrawer.style.display = 'block';
                    toggleSettingsBtn.classList.add('active');
                    messageBox.textContent = 'Логин должен содержать 3–20 символов (латиница, цифры или _).';
                    messageBox.className = 'form-message error';
                    return;
                }

                if (!newEmail || !newEmail.includes('@')) {
                    settingsDrawer.style.display = 'block';
                    toggleSettingsBtn.classList.add('active');
                    messageBox.textContent = 'Введите корректный Email.';
                    messageBox.className = 'form-message error';
                    return;
                }

                if (newPassword && newPassword.length < 4) {
                    settingsDrawer.style.display = 'block';
                    toggleSettingsBtn.classList.add('active');
                    messageBox.textContent = 'Новый пароль должен быть не короче 4 символов.';
                    messageBox.className = 'form-message error';
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.textContent = 'Сохранение...';
                messageBox.textContent = '';

                try {
                    const oldId = currentUsername.toLowerCase();
                    const newId = newUsername.toLowerCase();

                    const updatedData = {
                        ...loadedUserData,
                        username: newUsername,
                        displayName: newDisplayName,
                        bio: newBio,
                        email: newEmail,
                        avatar: currentAvatarBase64,
                        password: newPassword ? newPassword : loadedUserData.password
                    };

                    EXTRA_PROFILE_FIELDS.forEach(field => {
                        const el = document.getElementById(`extra-${field.key}`);
                        if (el) updatedData[field.key] = el.value.trim();
                    });

                    if (oldId !== newId) {
                        const targetDoc = await db.collection('users').doc(newId).get();
                        if (targetDoc.exists) {
                            messageBox.textContent = `Логин @${newUsername} уже занят другим пользователем.`;
                            messageBox.className = 'form-message error';
                            saveBtn.disabled = false;
                            saveBtn.textContent = 'Сохранить изменения';
                            return;
                        }

                        await db.collection('users').doc(newId).set(updatedData);
                        await db.collection('users').doc(oldId).delete();

                        localStorage.setItem('alushta_user', newUsername);
                        currentUsername = newUsername;
                    } else {
                        await db.collection('users').doc(oldId).update(updatedData);
                    }

                    localStorage.setItem('alushta_email', newEmail.toLowerCase());
                    loadedUserData = updatedData;
                    editPasswordInput.value = '';

                    usernameEl.textContent = newDisplayName
                        ? `${newDisplayName} (@${newUsername})`
                        : `@${newUsername}`;
                    emailEl.textContent = 'Email: ' + newEmail;
                    viewPublicLink.href = `user.html?u=${encodeURIComponent(newUsername)}`;

                    // Обновляем шапку сайта
                    const topLink = document.querySelector('.user-top-bar .profile-link');
                    if (topLink) {
                        const badgeHtml = isAdminUser()
                            ? '<span style="background: linear-gradient(135deg, #f5b041, #d4ac0d); color: #000; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; margin-left: 6px; letter-spacing: 0.5px;">ADMIN</span>'
                            : '';
                        const avatarHtml = currentAvatarBase64
                            ? `<img src="${currentAvatarBase64}" alt="avatar" class="top-bar-avatar">`
                            : '👤';
                        topLink.innerHTML = `${avatarHtml} ${newUsername}${badgeHtml}`;
                    }

                    messageBox.textContent = 'Профиль обновлён в облаке!';
                    messageBox.className = 'form-message success';
                    setTimeout(() => { messageBox.textContent = ''; }, 2500);
                } catch (err) {
                    console.error(err);
                    messageBox.textContent = 'Ошибка при сохранении профиля.';
                    messageBox.className = 'form-message error';
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Сохранить изменения';
                }
            });

            logoutBtn.addEventListener('click', () => {
                logoutUser();
            });

            // Объединяем недавние действия на сайте («Girls From Alushta» и «Поддержка»)
            let recentSupport = [];
            let recentGirls = [];

            function renderAllActivity() {
                const combined = [...recentGirls, ...recentSupport]
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    .slice(0, 15);

                activityList.innerHTML = '';

                if (combined.length === 0) {
                    activityList.innerHTML = '<p class="empty-posts">Пока нет недавних действий на сайте.</p>';
                    return;
                }

                combined.forEach(item => {
                    const link = document.createElement('a');
                    link.className = 'activity-item';
                    link.href = item.href;

                    const badge = document.createElement('div');
                    badge.className = 'activity-badge';
                    badge.textContent = item.icon;

                    const body = document.createElement('div');
                    body.className = 'activity-body';

                    const top = document.createElement('div');
                    top.className = 'activity-top';

                    const title = document.createElement('div');
                    title.className = 'activity-title';
                    title.innerHTML = item.titleHtml;

                    const time = document.createElement('span');
                    time.className = 'activity-time';
                    time.textContent = item.date || '';

                    top.appendChild(title);
                    top.appendChild(time);

                    const preview = document.createElement('p');
                    preview.className = 'activity-preview';
                    preview.textContent = item.previewText;

                    body.appendChild(top);
                    body.appendChild(preview);

                    link.appendChild(badge);
                    link.appendChild(body);
                    activityList.appendChild(link);
                });
            }

            // Слушаем новые анкеты из «Girls From Alushta»
            db.collection('girls_profiles').orderBy('createdAt', 'desc').limit(10).onSnapshot(snapshot => {
                recentGirls = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    recentGirls.push({
                        icon: '♥',
                        titleHtml: `Новая анкета: <span>${data.name}, ${data.age}</span> в «Girls From Alushta»`,
                        previewText: data.bio || '',
                        date: data.date || '',
                        createdAt: data.createdAt || 0,
                        href: 'about.html'
                    });
                });
                renderAllActivity();
            });

            // Слушаем обращения в «Поддержку»
            db.collection('support_tickets').orderBy('createdAt', 'desc').limit(10).onSnapshot(snapshot => {
                recentSupport = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isReport = data.type === 'report';
                    const sender = data.sender || 'Участник';
                    recentSupport.push({
                        icon: isReport ? '🚨' : '💬',
                        titleHtml: isReport
                            ? `<span>@${sender}</span> отправил(а) жалобу в «Поддержку»`
                            : `<span>@${sender}</span> задал(а) вопрос в «Поддержке»`,
                        previewText: isReport ? `На: ${data.target} — ${data.reason}` : (data.topic || data.text || ''),
                        date: data.date || '',
                        createdAt: data.createdAt || 0,
                        href: 'contacts.html'
                    });
                });
                renderAllActivity();
            });

            // Админ-блок управления пользователями (виден только администратору)
            if (isAdminUser()) {
                const adminUsersWrap = document.createElement('div');
                adminUsersWrap.style.cssText = 'max-width: 560px; margin: 30px auto; text-align: left;';
                adminUsersWrap.innerHTML = `
                    <h2 style="text-align: center;">👑 Управление пользователями</h2>
                    <div id="admin-users-list" class="activity-feed"></div>
                `;
                const activityHeading = activityList.previousElementSibling;
                activityList.parentNode.insertBefore(adminUsersWrap, activityHeading);

                const usersListEl = document.getElementById('admin-users-list');
                db.collection('users').onSnapshot(snapshot => {
                    usersListEl.innerHTML = '';
                    snapshot.forEach(doc => {
                        const u = doc.data();
                        const row = document.createElement('div');
                        row.className = 'activity-item';
                        row.style.alignItems = 'center';
                        row.innerHTML = `
                            <div class="activity-badge">👤</div>
                            <div class="activity-body">
                                <div class="activity-title"><span>@${u.username}</span>${u.displayName ? ' (' + u.displayName + ')' : ''}</div>
                                <p class="activity-preview">${u.email || ''} • Регистрация: ${u.regDate || '-'}</p>
                            </div>
                        `;
                        if (doc.id !== currentUsername.toLowerCase()) {
                            const banBtn = document.createElement('button');
                            banBtn.type = 'button';
                            banBtn.className = 'btn-danger';
                            banBtn.style.cssText = 'padding: 6px 12px; font-size: 12px;';
                            banBtn.textContent = 'Удалить';
                            banBtn.onclick = async () => {
                                if (confirm(`Удалить аккаунт @${u.username}?`)) {
                                    await db.collection('users').doc(doc.id).delete();
                                }
                            };
                            row.appendChild(banBtn);
                        }
                        usersListEl.appendChild(row);
                    });
                });
            }
        }
    </script>

</body>
</html>
