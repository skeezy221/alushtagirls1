<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт — Girls from Alushta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Вход в аккаунт</h1>
        <p>Введите свои данные для доступа к профилю.</p>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label for="login-username">Логин или Email</label>
                <input type="text" id="login-username" placeholder="Введите логин или почту" required>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль" required>
            </div>

            <div id="login-message" class="form-message"></div>

            <button type="submit" class="btn-submit" id="login-btn">Войти</button>

            <p class="auth-switch">Нет аккаунта? <a href="registr.html">Зарегистрироваться</a></p>
        </form>

        <nav>
            <a href="index.html">На главную</a>
            <a href="about.html" target="_blank">Girls From Alushta</a>
            <a href="contacts.html" target="_blank">Сугубое мнение</a>
            <a href="baze.html" target="_blank">FAQ</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const loginMessage = document.getElementById('login-message');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const loginInput = document.getElementById('login-username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('login-password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Проверка...';

            try {
                let foundUser = null;

                const directDoc = await db.collection('users').doc(loginInput).get();
                if (directDoc.exists && directDoc.data().password === passwordInput) {
                    foundUser = directDoc.data();
                } else {
                    const emailQuery = await db.collection('users').where('email', '==', loginInput).get();
                    emailQuery.forEach(doc => {
                        if (doc.data().password === passwordInput) {
                            foundUser = doc.data();
                        }
                    });
                }

                if (!foundUser) {
                    loginMessage.textContent = 'Неверный логин/почта или пароль!';
                    loginMessage.className = 'form-message error';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                    return;
                }

                localStorage.setItem('alushta_user', foundUser.username);
                loginMessage.textContent = 'Добро пожаловать, ' + foundUser.username + '!';
                loginMessage.className = 'form-message success';

                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 700);
            } catch (error) {
                console.error(error);
                loginMessage.textContent = 'Ошибка соединения с базой.';
                loginMessage.className = 'form-message error';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });
    </script>

</body>
</html>
