<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Вход в аккаунт</h1>
        <p>Войдите, чтобы открыть свой профиль и пользоваться всеми функциями.</p>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label for="login-username">Логин или Email</label>
                <input type="text" id="login-username" name="username" placeholder="Введите ваш логин или почту" required>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required>
            </div>

            <div id="login-message" class="form-message"></div>

            <button type="submit" class="btn-submit" id="login-submit-btn">Войти</button>

            <p class="auth-switch">Нет аккаунта? <a href="registr.html">Зарегистрироваться</a></p>
        </form>

        <nav>
            <a href="index.html">На главную</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a>
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js?v=5"></script>
    <script>
        const authInstance = typeof auth !== 'undefined' && auth ? auth : firebase.auth();

        if (getCurrentUsername()) {
            window.location.href = 'profile.html';
        }

        const loginForm = document.getElementById('login-form');
        const messageBox = document.getElementById('login-message');
        const submitBtn = document.getElementById('login-submit-btn');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const loginInput = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Проверка...';
            messageBox.textContent = '';

            try {
                let userDoc = null;

                if (loginInput.includes('@')) {
                    const snap = await db.collection('users').where('email', '==', loginInput.toLowerCase()).limit(1).get();
                    if (!snap.empty) {
                        userDoc = snap.docs[0];
                    }
                } else {
                    const doc = await db.collection('users').doc(loginInput.toLowerCase()).get();
                    if (doc.exists) {
                        userDoc = doc;
                    }
                }

                if (!userDoc) {
                    messageBox.textContent = 'Пользователь с таким логином или почтой не найден.';
                    messageBox.className = 'form-message error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Войти';
                    return;
                }

                const userData = userDoc.data();

                if (userData.uid && userData.email) {
                    const cred = await authInstance.signInWithEmailAndPassword(userData.email, password);

                    if (!cred.user.emailVerified) {
                        messageBox.innerHTML = `
                            ⚠️ Почта <strong>${userData.email}</strong> ещё не подтверждена!<br>
                            Перейдите по ссылке из письма в вашей почте.<br>
                            <button type="button" id="resend-email-btn" style="margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid #ff6b81; background: rgba(220,20,60,0.2); color: #fff; cursor: pointer; font-size: 12.5px;">Отправить письмо повторно</button>
                        `;
                        messageBox.className = 'form-message error';

                        document.getElementById('resend-email-btn').onclick = async () => {
                            try {
                                await cred.user.sendEmailVerification();
                                messageBox.textContent = 'Новое письмо отправлено! Проверьте почту и папку «Спам».';
                                messageBox.className = 'form-message success';
                            } catch (e) {
                                messageBox.textContent = 'Подождите минуту перед повторной отправкой.';
                            }
                        };

                        await authInstance.signOut();
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Войти';
                        return;
                    }

                    if (!userData.emailVerified) {
                        await db.collection('users').doc(userDoc.id).update({ emailVerified: true });
                    }
                } else {
                    if (userData.password !== password) {
                        messageBox.textContent = 'Неверный пароль!';
                        messageBox.className = 'form-message error';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Войти';
                        return;
                    }
                }

                localStorage.setItem('alushta_user', userData.username);
                if (userData.email) {
                    localStorage.setItem('alushta_email', userData.email.toLowerCase());
                }

                messageBox.textContent = 'Вход выполнен! Переходим в профиль...';
                messageBox.className = 'form-message success';

                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 700);
            } catch (error) {
                console.error('Ошибка входа:', error);
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    messageBox.textContent = 'Неверный пароль!';
                } else if (error.code === 'auth/too-many-requests') {
                    messageBox.textContent = 'Слишком много попыток входа. Попробуйте чуть позже.';
                } else {
                    messageBox.textContent = 'Ошибка при входе: ' + error.message;
                }
                messageBox.className = 'form-message error';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });
    </script>

</body>
</html>
