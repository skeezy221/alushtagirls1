<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Регистрация</h1>
        <p>Создайте аккаунт и подтвердите ваш Email, чтобы получить доступ ко всем функциям сайта.</p>

        <form class="auth-form" id="register-form">
            <div class="form-group">
                <label for="reg-username">Имя пользователя (логин)</label>
                <input type="text" id="reg-username" name="username" placeholder="Придумайте логин (латиница/цифры)" minlength="3" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Электронная почта (Email)</label>
                <input type="email" id="reg-email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="reg-password">Пароль (минимум 6 символов)</label>
                <input type="password" id="reg-password" name="password" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="reg-password-confirm">Подтвердите пароль</label>
                <input type="password" id="reg-password-confirm" name="password_confirm" placeholder="••••••••" minlength="6" required>
            </div>

            <div id="reg-message" class="form-message"></div>

            <button type="submit" class="btn-submit" id="reg-submit-btn">Зарегистрироваться</button>

            <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </form>

        <nav>
            <a href="index.html">На главную</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a>
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js?v=5"></script>
    <script>
        const authInstance = typeof auth !== 'undefined' && auth ? auth : firebase.auth();

        if (getCurrentUsername()) {
            window.location.href = 'profile.html';
        }

        const regForm = document.getElementById('register-form');
        const messageBox = document.getElementById('reg-message');
        const submitBtn = document.getElementById('reg-submit-btn');

        regForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-password-confirm').value;

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                messageBox.textContent = 'Логин должен содержать 3–20 символов (латиница, цифры или _).';
                messageBox.className = 'form-message error';
                return;
            }

            if (password !== confirmPassword) {
                messageBox.textContent = 'Ошибка: пароли не совпадают!';
                messageBox.className = 'form-message error';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Создание аккаунта...';
            messageBox.textContent = '';

            try {
                const userId = username.toLowerCase();
                const userDocRef = db.collection('users').doc(userId);
                const existingDoc = await userDocRef.get();

                if (existingDoc.exists) {
                    messageBox.textContent = 'Ошибка: пользователь с таким логином уже существует!';
                    messageBox.className = 'form-message error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Зарегистрироваться';
                    return;
                }

                // 1. Создаём пользователя в Firebase Authentication
                const userCredential = await authInstance.createUserWithEmailAndPassword(email, password);

                // 2. Отправляем письмо с подтверждением на почту
                await userCredential.user.sendEmailVerification();

                const today = new Date().toLocaleDateString('ru-RU');

                // 3. Сохраняем профиль в Firestore
                await userDocRef.set({
                    uid: userCredential.user.uid,
                    username: username,
                    email: email,
                    password: password,
                    bio: '',
                    avatar: '',
                    emailVerified: false,
                    regDate: today
                });

                // Выходим из неактивированной сессии до клика по ссылке в письме
                await authInstance.signOut();

                regForm.reset();
                messageBox.innerHTML = `
                    ✅ Письмо со ссылкой подтверждения отправлено на <strong>${email}</strong>!<br>
                    Откройте почту (проверьте папку «Спам»), перейдите по ссылке в письме, а затем <a href="login.html" style="color: #2ee59d; font-weight: bold;">войдите в аккаунт</a>.
                `;
                messageBox.className = 'form-message success';
            } catch (error) {
                console.error('Ошибка регистрации:', error);
                if (error.code === 'auth/email-already-in-use') {
                    messageBox.textContent = 'Эта почта уже зарегистрирована! Попробуйте войти.';
                } else if (error.code === 'auth/invalid-email') {
                    messageBox.textContent = 'Некорректный формат электронной почты!';
                } else if (error.code === 'auth/weak-password') {
                    messageBox.textContent = 'Пароль слишком простой (нужно минимум 6 символов).';
                } else {
                    messageBox.textContent = 'Ошибка при регистрации: ' + error.message;
                }
                messageBox.className = 'form-message error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>

</body>
</html>
