<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        /* Две главные кнопки действий */
        .hero-action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin: 28px auto 30px auto;
        }

        .hero-btn-search {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 26px;
            border-radius: 999px;
            background: rgba(12, 12, 18, 0.9);
            border: 2px solid #dc143c;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65), 0 0 14px rgba(220, 20, 60, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .hero-btn-search:hover,
        .hero-btn-search.active {
            background: rgba(220, 20, 60, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(220, 20, 60, 0.65);
        }

        .hero-btn-dating {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #dc143c, #ff2e55);
            border: none;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(220, 20, 60, 0.55);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hero-btn-dating:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(220, 20, 60, 0.85);
        }

        /* Блок поиска пользователей (появляется по нажатию кнопки) */
        .user-search-box {
            max-width: 480px;
            margin: 0 auto 35px auto;
            background: rgba(12, 12, 18, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 20, 60, 0.5);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85), 0 0 22px rgba(220, 20, 60, 0.22);
            text-align: left;
            box-sizing: border-box;
            animation: fadeInSearch 0.25s ease;
        }

        @keyframes fadeInSearch {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .search-box-header h2 {
            margin: 0;
            font-size: 19px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(220, 20, 60, 0.6);
        }

        .close-search-panel {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #ccc;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .close-search-panel:hover {
            background: #dc143c;
            color: #fff;
        }

        .search-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.68);
            margin: 0 0 16px 0;
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrap input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(220, 20, 60, 0.55);
            background: rgba(18, 18, 26, 0.95);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input-wrap input:focus {
            border-color: #ff2e55;
            box-shadow: 0 0 14px rgba(220, 20, 60, 0.45);
        }

        .clear-search-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            display: none;
        }

        .clear-search-btn:hover {
            color: #ff4d6d;
        }

        .search-results-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
        }

        .found-user-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(220, 20, 60, 0.35);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .found-user-card:hover {
            transform: translateY(-2px);
            border-color: #dc143c;
            background: rgba(220, 20, 60, 0.12);
            box-shadow: 0 4px 16px rgba(220, 20, 60, 0.35);
        }

        .found-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc143c, #8b0000);
            border: 2px solid #dc143c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .found-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .found-user-info {
            flex: 1;
            min-width: 0;
        }

        .found-user-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .found-user-name {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .found-user-name span {
            color: #ff6b81;
        }

        .found-user-date {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.5);
        }

        .found-user-bio {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .found-user-arrow {
            color: #ff6b81;
            font-size: 18px;
            font-weight: 700;
            opacity: 0.75;
        }

        .search-placeholder-msg {
            text-align: center;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.55);
            margin: 8px 0 0 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Знакомства Алушта Girls</h1>
        <p>Общение, новые встречи и атмосфера побережья Алушты.</p>

        <!-- Две кнопки рядом с небольшим интервалом -->
        <div class="hero-action-buttons">
            <button type="button" class="hero-btn-search" id="toggle-search-btn">🔍 Найти пользователя</button>
            <a href="about.html" class="hero-btn-dating">♥ Начать просмотр анкет</a>
        </div>

        <!-- Раскрывающийся блок поиска пользователей по username -->
        <section class="user-search-box" id="user-search-box" style="display: none;">
            <div class="search-box-header">
                <h2>Поиск участников</h2>
                <button type="button" class="close-search-panel" id="close-search-panel" title="Закрыть поиск">✕</button>
            </div>
            <p class="search-subtitle">Введите логин пользователя (@username), чтобы открыть его профиль</p>

            <div class="search-input-wrap">
                <input type="text" id="username-search-input" placeholder="Например: @admin или alina..." autocomplete="off">
                <button type="button" class="clear-search-btn" id="clear-search-btn" title="Очистить">✕</button>
            </div>

            <div class="search-results-list" id="search-results-list">
                <p class="search-placeholder-msg">Начните вводить никнейм для поиска...</p>
            </div>
        </section>

        <nav>
            <a href="index.html">Главная</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a> 
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js?v=6"></script>
    <script>
        const toggleSearchBtn = document.getElementById('toggle-search-btn');
        const closeSearchPanelBtn = document.getElementById('close-search-panel');
        const userSearchBox = document.getElementById('user-search-box');
        const searchInput = document.getElementById('username-search-input');
        const clearBtn = document.getElementById('clear-search-btn');
        const resultsList = document.getElementById('search-results-list');

        let allUsersCache = [];

        // Открытие и закрытие блока поиска по кнопке «Найти пользователя»
        toggleSearchBtn.addEventListener('click', () => {
            const isHidden = userSearchBox.style.display === 'none';
            if (isHidden) {
                userSearchBox.style.display = 'block';
                toggleSearchBtn.classList.add('active');
                searchInput.focus();
            } else {
                userSearchBox.style.display = 'none';
                toggleSearchBtn.classList.remove('active');
            }
        });

        closeSearchPanelBtn.addEventListener('click', () => {
            userSearchBox.style.display = 'none';
            toggleSearchBtn.classList.remove('active');
        });

        // Подгрузка пользователей из облака для мгновенного поиска
        db.collection('users').onSnapshot(snapshot => {
            allUsersCache = [];
            snapshot.forEach(doc => {
                allUsersCache.push(doc.data());
            });
            if (searchInput.value.trim() !== '') {
                renderSearchResults(searchInput.value);
            }
        });

        function renderSearchResults(rawQuery) {
            const cleanQuery = rawQuery.trim().replace(/^@+/, '').toLowerCase();

            if (!cleanQuery) {
                clearBtn.style.display = 'none';
                resultsList.innerHTML = '<p class="search-placeholder-msg">Начните вводить никнейм для поиска...</p>';
                return;
            }

            clearBtn.style.display = 'block';

            const matches = allUsersCache.filter(user =>
                user.username && user.username.toLowerCase().includes(cleanQuery)
            );

            resultsList.innerHTML = '';

            if (matches.length === 0) {
                resultsList.innerHTML = `<p class="search-placeholder-msg">Пользователь «@${cleanQuery}» не найден.</p>`;
                return;
            }

            matches.forEach(user => {
                const card = document.createElement('a');
                card.className = 'found-user-card';
                card.href = `user.html?u=${encodeURIComponent(user.username)}`;

                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'found-user-avatar';
                if (user.avatar) {
                    const img = document.createElement('img');
                    img.src = user.avatar;
                    img.alt = user.username;
                    avatarDiv.appendChild(img);
                } else {
                    avatarDiv.textContent = user.username.charAt(0).toUpperCase();
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'found-user-info';

                const topRow = document.createElement('div');
                topRow.className = 'found-user-top';

                const nameEl = document.createElement('div');
                nameEl.className = 'found-user-name';
                const isTargetAdmin = (typeof ADMIN_USERS !== 'undefined' && ADMIN_USERS.includes(user.username.toLowerCase())) ||
                                      (typeof ADMIN_EMAILS !== 'undefined' && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()));
                nameEl.innerHTML = `<span>@</span>${user.username}` + (isTargetAdmin
                    ? ' <span style="background: linear-gradient(135deg, #dc143c, #9e0b28); color: #ffffff; border: 1px solid #ff4d6d; box-shadow: 0 0 8px rgba(220, 20, 60, 0.7); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; margin-left: 4px;">ADMIN</span>'
                    : '');

                const dateEl = document.createElement('span');
                dateEl.className = 'found-user-date';
                dateEl.textContent = user.regDate ? `с ${user.regDate}` : '';

                topRow.appendChild(nameEl);
                topRow.appendChild(dateEl);

                const bioEl = document.createElement('p');
                bioEl.className = 'found-user-bio';
                bioEl.textContent = user.bio && user.bio.trim() !== ''
                    ? user.bio
                    : 'Статус пока не указан';

                infoDiv.appendChild(topRow);
                infoDiv.appendChild(bioEl);

                const arrowEl = document.createElement('span');
                arrowEl.className = 'found-user-arrow';
                arrowEl.textContent = '›';

                card.appendChild(avatarDiv);
                card.appendChild(infoDiv);
                card.appendChild(arrowEl);
                resultsList.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderSearchResults(e.target.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderSearchResults('');
            searchInput.focus();
        });
    </script>
</body>
</html>
