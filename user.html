<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль участника — Знакомства Алушта Girls</title>
    <link rel="stylesheet" href="style.css?v=8">
    <style>
        .public-profile-card {
            max-width: 480px;
            margin: 25px auto 35px auto;
            background: rgba(12, 12, 18, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 20, 60, 0.5);
            border-radius: 22px;
            padding: 28px 24px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.85), 0 0 24px rgba(220, 20, 60, 0.22);
            text-align: center;
            box-sizing: border-box;
        }

        .public-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, #dc143c, #8b0000);
            border: 3px solid #dc143c;
            box-shadow: 0 0 20px rgba(220, 20, 60, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
        }

        .public-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .public-username {
            margin: 0 0 6px 0;
            font-size: 23px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(220, 20, 60, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .public-username span.at-sign {
            color: #ff6b81;
        }

        .public-reg-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.58);
            margin: 0 0 18px 0;
        }

        /* Плашка статистики участника (Лайки / Время / Очки) */
        .public-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-pill-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(220, 20, 60, 0.32);
            border-radius: 14px;
            padding: 10px 8px;
        }

        .stat-pill-val {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .stat-pill-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.62);
        }

        .public-bio-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: left;
            margin-bottom: 22px;
        }

        .public-bio-label {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #ff6b81;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .public-bio-text {
            margin: 0;
            font-size: 14.5px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .public-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-profile-like {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #dc143c;
            background: rgba(220, 20, 60, 0.18);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-profile-like:hover {
            background: rgba(220, 20, 60, 0.35);
            box-shadow: 0 0 14px rgba(220, 20, 60, 0.55);
        }

        .btn-profile-like.liked {
            background: linear-gradient(135deg, #dc143c, #ff2e55);
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(220, 20, 60, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <div class="site-logo">AlushtaGirls</div>
    </header>

    <main>
        <h1>Профиль участника</h1>

        <section class="public-profile-card" id="public-profile-box">
            <p style="color: #ccc;">Загрузка профиля...</p>
        </section>

        <nav>
            <a href="index.html">Главная</a>
            <a href="about.html">Girls From Alushta</a>
            <a href="contacts.html">Поддержка</a>
            <a href="baze.html">FAQ</a>
            <a href="registr.html">Регистрация</a>
        </nav>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="auth.js?v=8"></script>
    <script>
        const profileBox = document.getElementById('public-profile-box');
        const params = new URLSearchParams(window.location.search);
        const targetUsername = (params.get('u') || '').trim();
        const currentUsername = getCurrentUsername();

        function loadPublicProfile() {
            if (!targetUsername) {
                profileBox.innerHTML = `
                    <p style="color: #ff6b81; margin-bottom: 16px;">Пользователь не указан.</p>
                    <a href="index.html" class="btn-submit">Вернуться к поиску</a>
                `;
                return;
            }

            if (currentUsername && currentUsername.toLowerCase() === targetUsername.toLowerCase()) {
                window.location.href = 'profile.html';
                return;
            }

            const userDocRef = db.collection('users').doc(targetUsername.toLowerCase());

            userDocRef.onSnapshot(doc => {
                if (!doc.exists) {
                    profileBox.innerHTML = `
                        <p style="color: #ff6b81; margin-bottom: 16px;">Пользователь «@${targetUsername}» не найден.</p>
                        <a href="index.html" class="btn-submit">← Назад к поиску</a>
                    `;
                    return;
                }

                const user = doc.data();
                document.title = `@${user.username} — Знакомства Алушта Girls`;

                const isTargetAdmin = (typeof ADMIN_USERS !== 'undefined' && ADMIN_USERS.includes(user.username.toLowerCase())) ||
                                      (typeof ADMIN_EMAILS !== 'undefined' && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()));

                const adminBadge = isTargetAdmin
                    ? '<span style="background: linear-gradient(135deg, #dc143c, #9e0b28); color: #ffffff; border: 1px solid #ff4d6d; box-shadow: 0 0 10px rgba(220, 20, 60, 0.7); font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px;">ADMIN</span>'
                    : '';

                const titleBadge = typeof renderUserTitleBadge === 'function' ? renderUserTitleBadge(user, false) : '';
                const frameClass = typeof getAvatarFrameClass === 'function' ? getAvatarFrameClass(user) : '';

                const avatarHtml = user.avatar
                    ? `<img src="${user.avatar}" alt="${user.username}">`
                    : user.username.charAt(0).toUpperCase();

                const bioText = user.bio && user.bio.trim() !== ''
                    ? user.bio
                    : 'Пользователь пока не добавил информацию о себе.';

                const likedByUsers = Array.isArray(user.likedByUsers) ? user.likedByUsers : [];
                const totalProfileLikes = user.profileLikes || likedByUsers.length || 0;
                const isLikedByMe = currentUsername && likedByUsers.includes(currentUsername.toLowerCase());
                const formattedTime = typeof formatTimeSpent === 'function'
                    ? formatTimeSpent(user.timeSpentMinutes || 0)
                    : `${user.timeSpentMinutes || 0} мин`;
                const points = user.activityPoints || 0;

                const hasAdminAccess = typeof isAdminUser === 'function' && isAdminUser();

                const displayTitle = user.displayName
                    ? `${user.displayName} (<span class="at-sign">@</span>${user.username})`
                    : `<span class="at-sign">@</span>${user.username}`;

                profileBox.innerHTML = `
                    <div class="public-avatar ${frameClass}">${avatarHtml}</div>
                    <h2 class="public-username">${displayTitle}${adminBadge}${titleBadge}</h2>
                    <p class="public-reg-date">На сайте с: ${user.regDate || 'недавно'}</p>

                    <div class="public-stats-grid">
                        <div class="stat-pill-box">
                            <div class="stat-pill-val">♥ ${totalProfileLikes}</div>
                            <div class="stat-pill-label">Лайки профиля</div>
                        </div>
                        <div class="stat-pill-box">
                            <div class="stat-pill-val">⏱ ${formattedTime}</div>
                            <div class="stat-pill-label">На сайте</div>
                        </div>
                        <div class="stat-pill-box">
                            <div class="stat-pill-val">⚡ ${points}</div>
                            <div class="stat-pill-label">Очки</div>
                        </div>
                    </div>

                    <div class="public-bio-box">
                        <div class="public-bio-label">О себе</div>
                        <p class="public-bio-text" id="public-bio-content"></p>
                    </div>

                    <div class="public-actions" id="public-actions">
                        <button type="button" class="btn-profile-like ${isLikedByMe ? 'liked' : ''}" id="like-profile-btn">
                            ${isLikedByMe ? '♥ Профиль понравился' : '♥ Лайкнуть профиль'}
                        </button>
                        <a href="index.html" class="btn-outline">← К поиску</a>
                        <a href="contacts.html?report=${encodeURIComponent('@' + user.username)}" class="btn-outline" style="border-color: rgba(255, 77, 109, 0.6); color: #ff6b81;">🚨 Пожаловаться</a>
                    </div>
                `;

                document.getElementById('public-bio-content').textContent = bioText;

                const likeProfileBtn = document.getElementById('like-profile-btn');
                likeProfileBtn.onclick = async () => {
                    if (!currentUsername) {
                        alert('Войдите в аккаунт, чтобы поставить лайк профилю!');
                        window.location.href = 'login.html';
                        return;
                    }

                    const meKey = currentUsername.toLowerCase();
                    if (likedByUsers.includes(meKey)) {
                        await userDocRef.update({
                            likedByUsers: firebase.firestore.FieldValue.arrayRemove(meKey),
                            profileLikes: firebase.firestore.FieldValue.increment(-1)
                        });
                    } else {
                        await userDocRef.update({
                            likedByUsers: firebase.firestore.FieldValue.arrayUnion(meKey),
                            profileLikes: firebase.firestore.FieldValue.increment(1),
                            activityPoints: firebase.firestore.FieldValue.increment(5)
                        });
                        if (typeof addUserActivityPoints === 'function') {
                            await addUserActivityPoints(currentUsername, 1);
                        }
                    }
                };

                if (hasAdminAccess) {
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'btn-danger';
                    delBtn.textContent = '👑 Удалить аккаунт';
                    delBtn.onclick = async () => {
                        if (confirm(`Удалить аккаунт @${user.username}?`)) {
                            await userDocRef.delete();
                            alert('Аккаунт удалён.');
                            window.location.href = 'index.html';
                        }
                    };
                    document.getElementById('public-actions').appendChild(delBtn);
                }
            }, err => {
                console.error(err);
                profileBox.innerHTML = `<p style="color: #ff6b81;">Ошибка при загрузке профиля.</p>`;
            });
        }

        loadPublicProfile();
    </script>

</body>
</html>
